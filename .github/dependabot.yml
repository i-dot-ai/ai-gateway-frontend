version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @astrojs/check only supports typescript ^5 || ^6; drop once it supports 7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
