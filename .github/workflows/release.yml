# Build and publish the frontend image to AWS ECR (ai-gateway-frontend)
# when a GitHub Release is published, or when dispatched with a version: the
# dispatched run creates the release at the dispatched commit, then builds it
# (one run, so automation only needs permission to dispatch this workflow).
#
# This mirrors the i.AI deployment pattern used by core-llm-gateway and minute:
# the build runs on an org EC2 runner started via the shared start-runner
# workflow, authenticates to AWS by OIDC, and pushes to ECR. The image is tagged
# from the release version:
#   {{version}}         e.g. 1.2.3
#   {{major}}.{{minor}} e.g. 1.2
#   {{major}}           e.g. 1
#   sha-<commit>        the exact commit (for pinning)
#   latest              stable releases only (never prereleases)
#
# Required org secrets: AWS_GITHUBRUNNER_PAT, AWS_REGION, AWS_ACCOUNT_ID.
# The OIDC role
#   arn:aws:iam::<AWS_ACCOUNT_ID>:role/infra/i-dot-ai-prod-<APP_NAME>-ci-deployment-role
# must exist and trust this repository, and be allowed to push to the
# ai-gateway-frontend ECR repository.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v1.2.3"
        required: true
        type: string

env:
  ECR_REPO_URL: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/ai-gateway-frontend
  VERSION: ${{ inputs.version || github.event.release.tag_name }}

jobs:
  # Dispatched runs only. A release made with GITHUB_TOKEN doesn't start
  # another run of this workflow, so the build below is the only one.
  create-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main; dispatched from $GITHUB_REF"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$VERSION already exists"
            exit 1
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes

  set-vars:
    runs-on: ubuntu-latest
    outputs:
      app-name: ${{ steps.export.outputs.app-name }}
      ec2-instance-type: ${{ steps.export.outputs.ec2-instance-type }}
      runner-size: ${{ steps.export.outputs.runner-size }}
      docker-build-instance: ${{ steps.export.outputs.docker-build-instance }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: export
        run: |
          . ./.github/.github.env
          echo "app-name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "ec2-instance-type=${EC2_INSTANCE_TYPE}" >> $GITHUB_OUTPUT
          echo "runner-size=${RUNNER_SIZE}" >> $GITHUB_OUTPUT
          echo "docker-build-instance=${DOCKER_BUILD_INSTANCE}" >> $GITHUB_OUTPUT

  start-runner:
    uses: i-dot-ai/i-dot-ai-core-github-actions/.github/workflows/start-runner.yml@main
    needs:
      - set-vars
      - create-release
    # create-release is skipped on release events; only a failure stops here.
    if: ${{ !failure() && !cancelled() }}
    permissions: write-all
    with:
      APP_NAME: ${{ needs.set-vars.outputs.app-name }}
      EC2_INSTANCE_TYPE: ${{ needs.set-vars.outputs.ec2-instance-type }}
      RUNNER_SIZE: ${{ needs.set-vars.outputs.runner-size }}
      USE_OIDC: true
    secrets:
      AWS_GITHUBRUNNER_PAT: ${{ secrets.AWS_GITHUBRUNNER_PAT }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  build-push:
    needs:
      - set-vars
      - start-runner
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ needs.start-runner.outputs.label }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: AWS Authentication
        uses: i-dot-ai/i-dot-ai-core-github-actions/.github/actions/authenticate-aws@main
        with:
          APP_NAME: ${{ needs.set-vars.outputs.app-name }}
          USE_OIDC: true
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        run: aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" | docker login --username AWS --password-stdin "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

      - name: Create Docker cache container
        env:
          INSTANCE_NAME: ${{ needs.set-vars.outputs.docker-build-instance }}
        run: |
          if docker buildx ls --format "{{.Name}}" | grep -w "${INSTANCE_NAME}"; then
            echo "Instance ${INSTANCE_NAME} found."
          else
            docker buildx create --name "${INSTANCE_NAME}" --driver docker-container
          fi

      - name: Export EFS cache path
        uses: i-dot-ai/i-dot-ai-core-github-actions/.github/actions/export-parameter@main
        with:
          PARAMETER_STORE_VAR_NAME: /github-runner-prod/efs-mount-path
          ENVIRONMENT_VAR_NAME: EFS_MOUNT_PATH

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REPO_URL }}
          flavor: |
            latest=false
          # value= so dispatched runs (ref is main, not the tag) get version tags too.
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          builder: ${{ needs.set-vars.outputs.docker-build-instance }}
          platforms: linux/amd64
          push: true
          cache-from: type=local,src=${{ env.EFS_MOUNT_PATH }}
          cache-to: type=local,dest=${{ env.EFS_MOUNT_PATH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  stop-runner:
    needs:
      - set-vars
      - start-runner
      - build-push
    if: needs.start-runner.outputs.use-persisted == 0 && always()
    permissions: write-all
    uses: i-dot-ai/i-dot-ai-core-github-actions/.github/workflows/stop-runner.yml@main
    with:
      APP_NAME: ${{ needs.set-vars.outputs.app-name }}
      RUNNER_LABEL: ${{ needs.start-runner.outputs.label }}
      EC2_INSTANCE_ID: ${{ needs.start-runner.outputs.ec2-instance-id }}
      USE_OIDC: true
    secrets:
      AWS_GITHUBRUNNER_PAT: ${{ secrets.AWS_GITHUBRUNNER_PAT }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
