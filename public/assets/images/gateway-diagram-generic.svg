<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-labelledby="title-generic desc-generic">
  <title id="title-generic">How the AI Gateway works</title>
  <desc id="desc-generic">Diagram showing your tool connecting to the AI Gateway, which then connects to AI models including Claude, Gemini, GPT and others.</desc>
  
  <!-- Your tool -->
  <rect x="20" y="60" width="120" height="100" rx="4" fill="#1d70b8" stroke="#003078" stroke-width="2"/>
  <text x="80" y="117" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Your tool</text>
  
  <!-- Arrow 1 -->
  <line x1="140" y1="110" x2="200" y2="110" stroke="#0b0c0c" stroke-width="2"/>
  <polygon points="200,105 215,110 200,115" fill="#0b0c0c"/>
  
  <!-- Gateway -->
  <rect x="215" y="60" width="140" height="100" rx="4" fill="#00703c" stroke="#004e2a" stroke-width="2"/>
  <text x="285" y="107" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AI Gateway</text>
  <text x="285" y="124" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">(using your key)</text>
  
  <!-- Arrow 2 -->
  <line x1="355" y1="110" x2="415" y2="110" stroke="#0b0c0c" stroke-width="2"/>
  <polygon points="415,105 430,110 415,115" fill="#0b0c0c"/>
  
  <!-- Models container - with equal 15px padding all around -->
  <rect x="430" y="15" width="150" height="220" rx="4" fill="#f3f2f1" stroke="#b1b4b6" stroke-width="2"/>
  <text x="505" y="40" text-anchor="middle" fill="#0b0c0c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Models</text>
  
  <!-- Model boxes - all 35px height, 120px width, 15px from edges -->
  <rect x="445" y="55" width="120" height="35" rx="2" fill="#fff7e6" stroke="#ffdd00" stroke-width="1"/>
  <text x="505" y="78" text-anchor="middle" fill="#0b0c0c" font-family="Arial, sans-serif" font-size="14">Claude</text>
  
  <rect x="445" y="100" width="120" height="35" rx="2" fill="#fff7e6" stroke="#ffdd00" stroke-width="1"/>
  <text x="505" y="123" text-anchor="middle" fill="#0b0c0c" font-family="Arial, sans-serif" font-size="14">Gemini</text>
  
  <rect x="445" y="145" width="120" height="35" rx="2" fill="#fff7e6" stroke="#ffdd00" stroke-width="1"/>
  <text x="505" y="168" text-anchor="middle" fill="#0b0c0c" font-family="Arial, sans-serif" font-size="14">GPT</text>
  
  <rect x="445" y="190" width="120" height="35" rx="2" fill="#fff7e6" stroke="#ffdd00" stroke-width="1"/>
  <text x="505" y="213" text-anchor="middle" fill="#505a5f" font-family="Arial, sans-serif" font-size="14">...</text>
</svg>
